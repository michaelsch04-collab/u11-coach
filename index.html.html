<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16713a"><meta name="apple-mobile-web-app-capable" content="yes">
<title>⚽ U11 Coach</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f6;color:#111}
.app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:8px 10px 10px;gap:7px}
header{display:flex;align-items:center;justify-content:space-between;min-height:48px}h1{font-size:23px;margin:0}.sub{font-size:13px;color:#667085;margin-top:2px}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}select,.top button{height:48px;background:#e8eaed;border-radius:15px;border:1px solid #d7dadd}
button{border:0;border-radius:14px;padding:10px 13px;font-weight:800}.primary{background:#16713a;color:white}.secondary{background:#e8eaed}.danger{background:#d84343;color:white}
.field-wrap{flex:1;min-height:0;display:flex}.field{position:relative;flex:1;min-height:0;border-radius:18px;background:#1f7d3f;border:3px solid #fff;box-shadow:0 1px 5px #0002;overflow:hidden}
.line-mid{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff}.box-top,.box-bottom{position:absolute;left:20%;width:60%;height:18%;border:3px solid #fff}.box-top{top:0;border-top:0}.box-bottom{bottom:0;border-bottom:0}
.circle{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}.spot{position:absolute;left:50%;top:50%;width:7px;height:7px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.player{position:absolute;transform:translate(-50%,-50%);width:70px;text-align:center;z-index:3;touch-action:none}.ball{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;margin:auto;box-shadow:0 2px 5px #0004}.name{display:inline-block;background:#101d17;color:#fff;border-radius:11px;padding:3px 7px;margin-top:3px;font-size:13px;font-weight:900;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:58px}.bslot{background:#e8eaed;border-radius:12px;padding:5px 3px;text-align:center;overflow:hidden}.bnum{font-weight:900;font-size:15px}.bname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal{width:min(560px,100%);max-height:88dvh;background:#fff;border-radius:20px 20px 0 0;padding:15px;overflow:auto}.modal h2{margin:0 0 8px}.help{font-size:13px;color:#667085}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.rowleft{display:flex;align-items:center;gap:7px;min-width:0}.rowleft input{width:55px;padding:7px;border:1px solid #ccc;border-radius:9px}
@media(max-height:700px){.app{gap:4px}.top button,select{height:42px;padding:7px}h1{font-size:20px}.ball{width:45px;height:45px;font-size:17px}.name{font-size:11px}.player{width:62px}.bench{height:48px}.footer button{padding:8px}}
</style></head><body>
<div class="app"><header><div><h1>⚽ U11 Coach</h1><div class="sub" id="status">Neue Aufstellung</div></div><button class="secondary" onclick="openPlayers()">Spieler</button></header>
<div class="top"><select id="formation" onchange="changeFormation(this.value)"><option value="7">7er</option><option value="8">8er</option><option value="9">9er</option></select><button class="secondary" onclick="newLineup()">Spiel</button><button class="primary" onclick="saveLineup()">Speichern</button></div>
<div class="field-wrap"><div class="field" id="field"><div class="line-mid"></div><div class="box-top"></div><div class="box-bottom"></div><div class="circle"></div><div class="spot"></div></div></div>
<div class="bench" id="bench"></div><div class="footer"><button class="secondary" onclick="openSaved()">Aufstellungen</button><button class="secondary" onclick="openPlayers()">Spieler verwalten</button></div></div>
<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const defaultRoster=[[1,"Matteo","Sorin"],[2,"Marco","Heinz"],[3,"Lucas","Lindner"],[4,"Julian","Biber"],[5,"Quirin","Mayinger"],[6,"Leonhard","Reber"],[7,"Milan","Eichinger"],[8,"Vitus","Schneider"],[9,"Jonas","Mayinger"],[10,"Dominic","Pruis"],[11,"Rouslan","Zosimidis"],[12,"Korbinian","Klinger"],[13,"Jonas","Schneider"],[14,"Tobias","Silbermann"],[15,"Kajetan","Radzimowski"],[16,"Zoey","Riss"],[17,"Laura","Schneider"],[18,"Milan","Ninkovic"],[19,"Marcel","Suszko"],[20,"Jonah","Leitmayr"],[21,"Noel","Geuder"],[22,"David","Burzler"],[23,"Oleh","Musienko"],[24,"Leni","Haarnagell"],[25,"Julian","Maile"],[26,"Maciek","Kala"],[27,"Benjamin","Pechtl"]];
let savedNums=JSON.parse(localStorage.getItem("u11_numbers")||"{}");
let roster=defaultRoster.map(x=>({id:x[0],number:Number(savedNums[x[0]]??x[0]),firstName:x[1],lastName:x[2]}));
const POS={7:[[50,9],[25,29],[75,29],[27,52],[73,52],[35,78],[65,78]],8:[[50,9],[20,29],[50,29],[80,29],[25,53],[50,53],[75,53],[50,79]],9:[[50,9],[20,29],[50,29],[80,29],[20,53],[50,53],[80,53],[35,79],[65,79]]};
let state={formation:7,field:[],bench:[],name:"Neue Aufstellung"};
function positions(){return POS[state.formation]}
function current(p){return roster.find(r=>r.id===p.id)||p}
function nextPos(){for(const [x,y] of positions())if(!state.field.some(q=>Math.abs(q.x-x)<1&&Math.abs(q.y-y)<1))return{x,y};return{x:50,y:50}}
function newLineup(){state.field=[];state.bench=[];roster.forEach(p=>{if(state.field.length<state.formation){let q=nextPos();state.field.push({player:p,x:q.x,y:q.y})}else if(state.bench.length<4)state.bench.push(p)});state.name="Neue Aufstellung";render()}
function changeFormation(v){state.formation=Number(v);let ps=state.field.map(x=>x.player).slice(0,state.formation);state.field=ps.map((p,i)=>({player:current(p),x:positions()[i][0],y:positions()[i][1]}));let used=new Set(state.field.map(x=>x.player.id));state.bench=roster.filter(p=>!used.has(p.id)).slice(0,4);render()}
function togglePlayer(id){let i=state.field.findIndex(x=>x.player.id===id);if(i>=0){let p=state.field[i].player;state.field.splice(i,1);if(!state.bench.some(q=>q.id===p.id)&&state.bench.length<4)state.bench.unshift(p)}else if(state.field.length<state.formation){let p=roster.find(x=>x.id===id);state.bench=state.bench.filter(x=>x.id!==id);let q=nextPos();state.field.push({player:p,x:q.x,y:q.y})}render();openPlayers()}
function changeNumber(id,val){let p=roster.find(x=>x.id===id),n=parseInt(val,10);if(!p||Number.isNaN(n))return;p.number=Math.max(0,Math.min(99,n));localStorage.setItem("u11_numbers",JSON.stringify(Object.fromEntries(roster.map(x=>[x.id,x.number]))));state.field.forEach(x=>{if(x.player.id===id)x.player=p});state.bench=state.bench.map(x=>x.id===id?p:x);render();openPlayers()}
function render(){document.getElementById("formation").value=state.formation;document.getElementById("status").textContent=state.name;let f=document.getElementById("field");f.querySelectorAll(".player").forEach(e=>e.remove());state.field.forEach(fp=>{let d=document.createElement("div");d.className="player";d.style.left=fp.x+"%";d.style.top=fp.y+"%";d.innerHTML=`<div class="ball">${fp.player.number}</div><div class="name">${fp.player.firstName}</div>`;d.onclick=()=>togglePlayer(fp.player.id);f.appendChild(d)});let b=document.getElementById("bench");b.innerHTML="";for(let i=0;i<4;i++){let p=state.bench[i],d=document.createElement("div");d.className="bslot";d.innerHTML=p?`<div class="bnum">${p.number}</div><div class="bname">${p.firstName}</div>`:`<div style="color:#98a2b3;padding-top:7px">frei</div>`;if(p)d.onclick=()=>swapBench(p.id);b.appendChild(d)}}
function swapBench(id){let bi=state.bench.findIndex(p=>p.id===id);if(bi<0)return;let bp=state.bench[bi],fp=state.field[state.field.length-1];if(!fp)return;state.field[state.field.length-1]={player:bp,x:fp.x,y:fp.y};state.bench[bi]=fp.player;render()}
function openPlayers(){let h=`<h2>Spieler</h2><p class="help">Die Trikotnummer ist für jeden Spieler gespeichert, kann aber jederzeit geändert werden. Neue Spieler kommen automatisch auf die nächste freie Position.</p>`;h+=roster.map(p=>{let on=state.field.some(x=>x.player.id===p.id);return `<div class="row"><div class="rowleft"><input type="number" min="0" max="99" value="${p.number}" onchange="changeNumber(${p.id},this.value)"><span>${p.firstName} ${p.lastName}</span></div><button class="${on?'danger':'secondary'}" onclick="togglePlayer(${p.id})">${on?'Vom Feld':'Aufs Feld'}</button></div>`}).join("");h+=`<br><button class="primary" onclick="closeModal()">Fertig</button>`;openModal(h)}
function saveLineup(){let arr=JSON.parse(localStorage.getItem("u11_saved")||"[]");arr.unshift({formation:state.formation,name:state.name,field:state.field,bench:state.bench});localStorage.setItem("u11_saved",JSON.stringify(arr.slice(0,20)));alert("Aufstellung gespeichert.");}
function openSaved(){let arr=JSON.parse(localStorage.getItem("u11_saved")||"[]"),h="<h2>Gespeicherte Aufstellungen</h2>";if(!arr.length)h+="<p>Noch keine Aufstellung gespeichert.</p>";arr.forEach((s,i)=>h+=`<div class="row"><span>${s.name||"Aufstellung"} · ${s.formation}er</span><button class="secondary" onclick="loadSaved(${i})">Öffnen</button></div>`);h+=`<br><button onclick="closeModal()">Schließen</button>`;openModal(h)}
function loadSaved(i){let s=JSON.parse(localStorage.getItem("u11_saved")||"[]")[i];if(!s)return;state.formation=s.formation;state.name=s.name||"Aufstellung";state.field=(s.field||[]).map(x=>({...x,player:current(x.player)}));state.bench=(s.bench||[]).map(current);closeModal();render()}
function openModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("modalbg").style.display="flex"}function closeModal(){document.getElementById("modalbg").style.display="none"}newLineup();
</script></body></html>
