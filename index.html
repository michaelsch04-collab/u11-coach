<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#176b3a">
<title>U11 Coach</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{height:100dvh;max-width:620px;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#667085}
button,select,input{font:inherit}button{border:0;border-radius:11px;padding:9px 10px;font-weight:700}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.top button,.top select{height:40px;border:1px solid #d0d5dd;background:#e5e7eb}
.green{background:#176b3a!important;color:white!important;border-color:#176b3a!important}
.fieldWrap{flex:1;min-height:0}.field{position:relative;width:100%;height:100%;overflow:hidden;background:#278448;border:3px solid white;border-radius:17px;touch-action:none}
.line{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff}.circle{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%}
.spot{position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%);background:white;border-radius:50%}
.box{position:absolute;left:21%;width:58%;height:18%;border:2px solid white}.box.top{top:-2px;border-top:0}.box.bottom{bottom:-2px;border-bottom:0}
.player{position:absolute;width:70px;transform:translate(-50%,-50%);text-align:center;z-index:3;touch-action:none;user-select:none}.ball{width:48px;height:48px;margin:auto;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 2px 5px #0005}.pname{display:inline-block;max-width:76px;padding:2px 5px;background:#10251a;color:#fff;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench{height:53px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.slot{background:#e5e7eb;border-radius:10px;text-align:center;padding:5px 2px;overflow:hidden}.slot .num{font-weight:900;font-size:14px}.slot .bn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.free{font-size:10px;color:#98a2b3;padding-top:7px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bottom button{height:38px;background:#e5e7eb}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal{width:min(620px,100%);max-height:92dvh;overflow:auto;background:white;border-radius:20px 20px 0 0;padding:15px}
.modal h2{margin:0 0 6px}.help{font-size:13px;color:#667085;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.info{display:flex;align-items:center;gap:7px;min-width:0}.nameInputs{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:0}.nameInputs input,.new input{width:100%;padding:7px;border:1px solid #ccc;border-radius:8px}.numInput{width:48px;padding:7px 3px;border:1px solid #ccc;border-radius:8px;text-align:center}.actions{display:flex;gap:4px}.actions button{font-size:12px;padding:8px 7px;background:#e5e7eb}.deleteBtn{background:#fee2e2!important;color:#991b1b!important}.actions .active{background:#176b3a;color:white}.close{width:100%;margin-top:10px;background:#176b3a;color:white}.new{display:grid;grid-template-columns:1fr 1fr 60px;gap:5px}.add{width:100%;margin-top:5px;background:#176b3a;color:white}
@media(max-height:650px){.app{gap:4px;padding:5px}.top button,.top select{height:36px}.ball{width:42px;height:42px}.player{width:62px}.bench{height:44px}.bottom button{height:34px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>⚽ U11 Coach</h1><div class="sub" id="status">Neue Aufstellung</div></div><button id="players">Spieler</button></header>
<div class="top"><select id="formation"><option value="7">7er-Aufstellung</option><option value="8">8er-Aufstellung</option><option value="9">9er-Aufstellung</option></select><button id="new">Neue Aufstellung</button><button id="save" class="green">Speichern</button></div>
<div class="fieldWrap"><div class="field" id="field"><div class="line"></div><div class="circle"></div><div class="spot"></div><div class="box top"></div><div class="box bottom"></div></div></div>
<div class="bench" id="bench"></div>
<div class="bottom"><button id="saved">Aufstellungen</button><button id="manage">Spieler verwalten</button></div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
const $=id=>document.getElementById(id);
const field=$("field"), bench=$("bench"), formation=$("formation"), status=$("status");
const overlay=$("overlay"), modal=$("modal"), players=$("players"), manage=$("manage");
const saved=$("saved"), save=$("save"), newBtn=$("new");
const defaultPlayers=[
[1,"Matteo","Sorin"],[2,"Marco","Heinz"],[3,"Lucas","Lindner"],[4,"Julian","Biber"],[5,"Quirin","Mayinger"],[6,"Leonhard","Reber"],[7,"Milan","Eichinger"],[8,"Vitus","Schneider"],[9,"Jonas","Mayinger"],[10,"Dominic","Pruis"],[11,"Rouslan","Zosimidis"],[12,"Korbinian","Klinger"],[13,"Jonas","Schneider"],[14,"Tobias","Silbermann"],[15,"Kajetan","Radzimowski"],[16,"Zoey","Riss"],[17,"Laura","Schneider"],[18,"Milan","Ninkovic"],[19,"Marcel","Suszko"],[20,"Jonah","Leitmayr"],[21,"Noel","Geuder"],[22,"David","Burzler"],[23,"Oleh","Musienko"],[24,"Leni","Haarnagell"],[25,"Julian","Maile"],[26,"Maciek","Kala"],[27,"Benjamin","Pechtl"]
];
let roster=JSON.parse(localStorage.getItem("u11_roster_v1")||"null");
if(!Array.isArray(roster))roster=defaultPlayers.map(x=>({id:x[0],number:x[0],firstName:x[1],lastName:x[2]}));
function persistRoster(){localStorage.setItem("u11_roster_v1",JSON.stringify(roster))}
function getPlayer(id){return roster.find(p=>p.id===Number(id))}
const POS={7:[[50,10],[25,31],[75,31],[23,57],[77,57],[36,82],[64,82]],8:[[50,9],[20,30],[50,30],[80,30],[25,57],[50,57],[75,57],[50,83]],9:[[50,8],[20,29],[50,29],[80,29],[20,55],[50,55],[80,55],[35,83],[65,83]]};
let state={formation:7,field:[],bench:[],name:"Neue Aufstellung"};

function freePos(){for(const q of POS[state.formation])if(!state.field.some(x=>Math.abs(x.x-q[0])<.01&&Math.abs(x.y-q[1])<.01))return{x:q[0],y:q[1]};return{x:50,y:50}}
function closeModal(){overlay.style.display="none"}
function openModal(s){modal.innerHTML=s;overlay.style.display="flex"}
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal()});

function newLineup(){state={formation:Number(formation.value),field:[],bench:[],name:"Neue Aufstellung"};render();closeModal()}

function setPlace(id,place){
 const p=getPlayer(id);if(!p)return;
 const fi=state.field.findIndex(x=>x.player.id===p.id),bi=state.bench.findIndex(x=>x.id===p.id);
 if(place==="field"){
   if(fi>=0){state.field.splice(fi,1);render();openPlayers();return}
   if(state.field.length>=state.formation){alert("Maximal "+state.formation+" Spieler können aufs Feld.");return}
   if(bi>=0)state.bench.splice(bi,1);
   const q=freePos();state.field.push({player:p,x:q.x,y:q.y});
 }else{
   if(bi>=0){state.bench.splice(bi,1);render();openPlayers();return}
   if(state.bench.length>=6){alert("Maximal 6 Spieler können auf der Bank sein.");return}
   if(fi>=0)state.field.splice(fi,1);
   state.bench.push(p);
 }
 render();openPlayers();
}

function render(){
 status.textContent=state.name;
 formation.value=state.formation;
 field.querySelectorAll(".player").forEach(e=>e.remove());
 state.field.forEach(fp=>{
   const d=document.createElement("div");d.className="player";d.style.left=fp.x+"%";d.style.top=fp.y+"%";
   d.innerHTML='<div class="ball">'+fp.player.number+'</div><div class="pname">'+esc(fp.player.firstName)+'</div>';
   let drag=false,sx=0,sy=0,ox=0,oy=0;
   d.onpointerdown=e=>{e.preventDefault();drag=true;sx=e.clientX;sy=e.clientY;d.setPointerCapture(e.pointerId);const r=field.getBoundingClientRect();ox=e.clientX-r.left-fp.x/100*r.width;oy=e.clientY-r.top-fp.y/100*r.height};
   d.onpointermove=e=>{if(!drag)return;const r=field.getBoundingClientRect();if(Math.hypot(e.clientX-sx,e.clientY-sy)<4)return;fp.x=Math.max(6,Math.min(94,(e.clientX-r.left-ox)/r.width*100));fp.y=Math.max(7,Math.min(93,(e.clientY-r.top-oy)/r.height*100));d.style.left=fp.x+"%";d.style.top=fp.y+"%"};
   d.onpointerup=()=>drag=false;d.onpointercancel=()=>drag=false;d.ondblclick=e=>e.preventDefault();
   field.appendChild(d);
 });
 bench.innerHTML="";
 for(let i=0;i<6;i++){const p=state.bench[i],d=document.createElement("div");d.className="slot";d.innerHTML=p?'<div class="num">'+p.number+'</div><div class="bn">'+esc(p.firstName)+'</div>':'<div class="free">frei</div>';bench.appendChild(d)}
}

function openPlayers(){
 let h='<h2>Spieler</h2><p class="help">Grün bedeutet: Spieler ist auf dem Feld. Noch einmal „Aufs Feld“ anklicken nimmt ihn wieder vom Feld. Die Bank hat bis zu 6 Plätze.</p>';
 roster.forEach(p=>{
  const on=state.field.some(x=>x.player.id===p.id),bank=state.bench.some(x=>x.id===p.id);
  h+='<div class="row"><div class="info"><input class="numInput" type="number" min="0" max="99" value="'+p.number+'" data-num="'+p.id+'"><b>'+esc(p.firstName+' '+p.lastName)+'</b></div><div class="actions"><button type="button" class="'+(on?'active':'')+'" data-place="field" data-id="'+p.id+'">Aufs Feld</button><button type="button" class="'+(bank?'active':'')+'" data-place="bench" data-id="'+p.id+'">Auf die Bank</button></div></div>'
 });
 h+='<button type="button" class="close" id="closeP">Fertig</button>';openModal(h);
 document.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>setPlace(b.dataset.id,b.dataset.place));
 document.querySelectorAll("[data-num]").forEach(i=>i.onchange=()=>{const p=getPlayer(i.dataset.num);p.number=Math.max(0,Math.min(99,parseInt(i.value)||0));persistRoster();render();openPlayers()});
 $("closeP").onclick=closeModal;
}

function openManage(){
 let h='<h2>Spieler verwalten</h2><p class="help">Spieler hinzufügen, Namen oder Nummer ändern und Spieler löschen.</p>';
 h+='<div class="new"><input id="nf" placeholder="Vorname"><input id="nl" placeholder="Nachname"><input id="nn" type="number" min="0" max="99" placeholder="Nr."></div><button type="button" class="add" id="add">+ Spieler hinzufügen</button>';
 roster.forEach(p=>{
  h+='<div class="row"><div class="info"><input class="numInput" type="number" min="0" max="99" value="'+p.number+'" data-mn="'+p.id+'"><div class="nameInputs"><input value="'+esc(p.firstName)+'" data-mf="'+p.id+'"><input value="'+esc(p.lastName)+'" data-ml="'+p.id+'"></div></div><div class="actions"><button type="button" class="deleteBtn" onclick="return window.deletePlayerById('+p.id+')">🗑 Löschen</button></div></div>'
 });
 h+='<button type="button" class="close" id="closeM">Schließen</button>';
 openModal(h);

 $("add").onclick=function(){
   const f=$("nf").value.trim(),l=$("nl").value.trim(),raw=$("nn").value;
   if(!f){alert("Bitte einen Vornamen eingeben.");return}
   const id=roster.length?Math.max.apply(null,roster.map(p=>p.id))+1:1;
   const n=raw.trim()===""?id:Math.max(0,Math.min(99,parseInt(raw,10)||0));
   roster.push({id:id,number:n,firstName:f,lastName:l});
   persistRoster();openManage();
 };

 // One handler on the modal catches every delete button.


 modal.querySelectorAll("[data-mn]").forEach(function(i){i.onchange=function(){
   const p=getPlayer(i.dataset.mn);if(!p)return;
   p.number=Math.max(0,Math.min(99,parseInt(i.value,10)||0));persistRoster();render();
 }});
 modal.querySelectorAll("[data-mf]").forEach(function(i){i.onchange=function(){
   const p=getPlayer(i.dataset.mf);if(!p)return;
   p.firstName=i.value.trim()||"Spieler";persistRoster();render();
 }});
 modal.querySelectorAll("[data-ml]").forEach(function(i){i.onchange=function(){
   const p=getPlayer(i.dataset.ml);if(!p)return;
   p.lastName=i.value.trim();persistRoster();render();
 }});
 $("closeM").onclick=closeModal;
}

window.deletePlayerById=function(id){
 const num=Number(id);
 const idx=roster.findIndex(function(x){return Number(x.id)===num});
 if(idx===-1)return false;
 roster.splice(idx,1);
 state.field=state.field.filter(function(x){return !x.player || Number(x.player.id)!==num});
 state.bench=state.bench.filter(function(x){return Number(x.id)!==num});
 persistRoster();
 render();
 openManage();
 const oldStatus=status.textContent;
 status.textContent="Spieler gelöscht";
 setTimeout(function(){status.textContent=oldStatus},1200);
 return false;
};

function saveLineup(){
 const n=prompt("Name der Aufstellung:",state.name==="Neue Aufstellung"?"Aufstellung":state.name);if(n===null)return;
 state.name=n.trim()||"Aufstellung";
 const list=JSON.parse(localStorage.getItem("u11_saved_v1")||"[]");list.unshift(JSON.parse(JSON.stringify(state)));localStorage.setItem("u11_saved_v1",JSON.stringify(list.slice(0,30)));render();alert("Gespeichert.");
}
function openSaved(){
 const list=JSON.parse(localStorage.getItem("u11_saved_v1")||"[]");
 let h='<h2>Aufstellungen</h2><p class="help">Gespeicherte Aufstellungen öffnen oder löschen.</p>';
 if(!list.length)h+='<p class="help">Noch keine Aufstellung gespeichert.</p>';
 list.forEach((s,i)=>h+='<div class="row"><div><b>'+esc(s.name)+'</b><br><small>'+s.formation+'er-Aufstellung</small></div><div class="actions"><button type="button" data-open="'+i+'">Öffnen</button><button type="button" data-del-save="'+i+'">Löschen</button></div></div>');
 h+='<button type="button" class="close" id="closeS">Schließen</button>';openModal(h);
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const s=list[Number(b.dataset.open)];state={formation:Number(s.formation),name:s.name,field:s.field.map(x=>({x:x.x,y:x.y,player:getPlayer(x.player.id)})).filter(x=>x.player),bench:s.bench.map(x=>getPlayer(x.id)).filter(Boolean)};closeModal();render()});
 document.querySelectorAll("[data-del-save]").forEach(b=>b.onclick=()=>{const a=JSON.parse(localStorage.getItem("u11_saved_v1")||"[]");a.splice(Number(b.dataset.delSave),1);localStorage.setItem("u11_saved_v1",JSON.stringify(a));openSaved()});
 $("closeS").onclick=closeModal;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

players.onclick=openPlayers;manage.onclick=openManage;saved.onclick=openSaved;save.onclick=saveLineup;newBtn.onclick=newLineup;
formation.onchange=()=>{state.formation=Number(formation.value);if(state.field.length>state.formation){const extra=state.field.splice(state.formation);extra.forEach(x=>{if(state.bench.length<6)state.bench.push(x.player)})}state.field.forEach((x,i)=>{x.x=POS[state.formation][i][0];x.y=POS[state.formation][i][1]});render()};
render();
</script>
</body>
</html>
