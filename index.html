<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16713a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>U11 Coach</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f6;color:#111}
button,select,input{font:inherit}
button{border:0;border-radius:12px;padding:9px 12px;background:#16713a;color:#fff;font-weight:700}
button.secondary{background:#e8eaed;color:#111}
button.danger{background:#b42318;color:#fff}
.app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:auto}
header{height:58px;flex:0 0 58px;padding:9px 12px 5px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;line-height:1;margin:0 0 3px}
small{color:#6b7280}
.controls{flex:0 0 48px;display:grid;grid-template-columns:90px 1fr 1fr;gap:7px;padding:0 10px 7px}
.controls>*{min-width:0;height:41px}
.fieldWrap{flex:1;min-height:0;padding:0 10px}
.field{position:relative;width:100%;height:100%;background:#217b3e;border-radius:16px;overflow:hidden;touch-action:none}
.field:before{content:"";position:absolute;inset:2px;border:2px solid rgba(255,255,255,.9)}
.field:after{content:"";position:absolute;left:20%;right:20%;top:16%;bottom:16%;border:2px solid rgba(255,255,255,.9)}
.line{position:absolute;background:#fff;opacity:.9}
.mid{left:0;right:0;top:50%;height:2px}
.circle{position:absolute;width:24%;aspect-ratio:1;border:2px solid #fff;border-radius:50%;left:38%;top:38%}
.player{position:absolute;transform:translate(-50%,-50%);text-align:center;touch-action:none;z-index:3}
.ball{width:39px;height:39px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 2px 7px #0005}
.name{margin-top:2px;color:#fff;background:#111d;padding:2px 6px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap}
.bottom{flex:0 0 105px;padding:6px 10px calc(7px + env(safe-area-inset-bottom));background:#f4f5f6}
.benchTitle{display:flex;justify-content:space-between;align-items:center;margin:0 2px 5px;font-size:13px;font-weight:800}
.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:38px}
.slot{min-width:0;border-radius:10px;background:#e8eaed;color:#111;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.slot.empty{color:#777;font-weight:600}
footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
footer button{height:37px;padding:5px 6px;font-size:12px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;margin:auto;max-height:88dvh;border-radius:20px 20px 0 0;padding:15px;overflow:auto}
.sheet h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.row span{flex:1;min-width:0}
.row button{padding:7px 9px;font-size:12px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;margin:4px 0 9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{font-size:12px;color:#666;margin:0 0 8px}
@media(max-height:650px){
 header{height:52px;flex-basis:52px}
 h1{font-size:20px}
 .controls{flex-basis:44px}
 .controls>*{height:37px;padding:5px 8px}
 .bottom{flex-basis:92px}
 .bench{height:32px}
 footer{margin-top:4px}
 footer button{height:32px}
 .ball{width:34px;height:34px;font-size:16px}
 .name{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>⚽ U11 Coach</h1><small id="subtitle">Neue Aufstellung</small></div>
  <button class="secondary" onclick="openRoster()">Spieler</button>
</header>

<div class="controls">
  <select id="formation" onchange="changeFormation()">
    <option value="7">7er</option><option value="8">8er</option><option value="9">9er</option>
  </select>
  <button class="secondary" onclick="openDetails()">Spiel</button>
  <button onclick="openSave()">Speichern</button>
</div>

<div class="fieldWrap">
  <div class="field" id="field"><div class="line mid"></div><div class="circle"></div></div>
</div>

<div class="bottom">
  <div class="benchTitle"><span>Ersatzbank</span><span>4 Plätze</span></div>
  <div class="bench" id="bench"></div>
  <footer>
    <button class="secondary" onclick="openSaved()">Aufstellungen</button>
    <button class="secondary" onclick="openBench()">Bank wählen</button>
    <button onclick="shareImage()">Bild teilen</button>
  </footer>
</div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const roster=[
[1,"Matteo","Sorin"],[2,"Marco","Heinz"],[3,"Lucas","Lindner"],[4,"Julian","Biber"],
[5,"Quirin","Mayinger"],[6,"Leonhard","Reber"],[7,"Milan","Eichinger"],[8,"Vitus","Schneider"],
[9,"Jonas","Mayinger"],[10,"Dominic","Pruis"],[11,"Rouslan","Zosimidis"],[12,"Korbinian","Klinger"],
[13,"Jonas","Schneider"],[14,"Tobias","Silbermann"],[15,"Kajetan","Radzimowski"],[16,"Zoey","Riss"],
[17,"Laura","Schneider"],[18,"Milan","Ninkovic"],[19,"Marcel","Suszko"],[20,"Jonah","Leitmayr"],
[21,"Noel","Geuder"],[22,"David","Burzler"],[23,"Oleh","Musienko"],[24,"Leni","Haarnagell"],
[25,"Julian","Maile"],[26,"Maciek","Kala"],[27,"Benjamin","Pechtl"]
].map(x=>({number:x[0],firstName:x[1],lastName:x[2]}));

const positions=[
[50,9],[24,30],[50,29],[76,30],[21,57],[50,52],[79,57],[35,76],[65,76]
];

let state={
 formation:7,name:"Neue Aufstellung",opponent:"",
 date:new Date().toISOString().slice(0,10),
 field:[],bench:[],saved:JSON.parse(localStorage.getItem("u11_saved")||"[]")
};

function defaultField(n){
  return roster.slice(0,n).map((p,i)=>({player:p,x:positions[i][0],y:positions[i][1]}));
}
state.field=defaultField(7);
state.bench=roster.slice(7,11);
render();

function render(){
 document.getElementById("formation").value=String(state.formation);
 document.getElementById("subtitle").textContent=state.opponent?`gegen ${state.opponent}`:state.name;
 const f=document.getElementById("field");
 f.querySelectorAll(".player").forEach(x=>x.remove());
 state.field.forEach(fp=>{
   const el=document.createElement("div");
   el.className="player";
   el.style.left=fp.x+"%"; el.style.top=fp.y+"%";
   el.innerHTML=`<div class="ball">${fp.player.number}</div><div class="name">${fp.player.firstName}</div>`;
   addDrag(el,fp); f.appendChild(el);
 });
 const ids=new Set(state.field.map(x=>x.player.number));
 const bench=document.getElementById("bench");
 bench.innerHTML="";
 for(let i=0;i<4;i++){
   const p=state.bench[i];
   const el=document.createElement("div");
   el.className="slot"+(p?"":" empty");
   el.textContent=p?`${p.number} ${p.firstName}`:"frei";
   if(p) el.onclick=()=>swapBenchToField(p.number);
   bench.appendChild(el);
 }
}

function addDrag(el,fp){
 let active=false;
 el.addEventListener("pointerdown",e=>{
   active=true; el.setPointerCapture(e.pointerId); e.preventDefault();
 });
 el.addEventListener("pointermove",e=>{
   if(!active)return;
   const r=document.getElementById("field").getBoundingClientRect();
   fp.x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));
   fp.y=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100));
   el.style.left=fp.x+"%"; el.style.top=fp.y+"%";
 });
 el.addEventListener("pointerup",()=>active=false);
 el.addEventListener("contextmenu",e=>{
   e.preventDefault();
   const old=state.field.filter(x=>x.player.number!==fp.player.number);
   state.field=old;
   if(!state.bench.some(p=>p.number===fp.player.number)) state.bench.push(fp.player);
   state.bench=state.bench.slice(0,4);
   render();
 });
}

function changeFormation(){
 const n=parseInt(document.getElementById("formation").value);
 let players=state.field.map(x=>x.player);
 while(players.length<n){
   const p=roster.find(p=>!players.some(q=>q.number===p.number));
   if(!p)break; players.push(p);
 }
 while(players.length>n) {
   const p=players.pop();
   if(!state.bench.some(q=>q.number===p.number)) state.bench.unshift(p);
 }
 state.formation=n;
 state.field=players.map((p,i)=>({player:p,x:positions[i][0],y:positions[i][1]}));
 state.bench=state.bench.filter(p=>!state.field.some(x=>x.player.number===p.number)).slice(0,4);
 render();
}

function swapBenchToField(num){
 const bi=state.bench.findIndex(p=>p.number===num);
 if(bi<0)return;
 const benchPlayer=state.bench[bi];
 const replace=state.field[state.field.length-1];
 if(!replace)return;
 state.field[state.field.length-1]={player:benchPlayer,x:replace.x,y:replace.y};
 state.bench[bi]=replace.player;
 render();
}

function closeModal(){document.getElementById("modal").classList.remove("open")}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open")}

function openRoster(){
 openModal(`<h2>Spieler – ${state.field.length}/${state.formation} auf dem Feld</h2>
 <p class="help">„Aufs Feld“ setzt den Spieler auf die nächste freie Position. „Vom Feld“ setzt ihn auf die Ersatzbank.</p>
 ${roster.map(p=>{
   const on=state.field.some(x=>x.player.number===p.number);
   return `<div class="row"><span><b>${p.number}</b> ${p.firstName} ${p.lastName}</span>
   <button class="${on?'danger':'secondary'}" onclick="togglePlayer(${p.number})">${on?'Vom Feld':'Aufs Feld'}</button></div>`;
 }).join("")}<br><button onclick="closeModal()">Fertig</button>`);
}

function togglePlayer(n){
 const idx=state.field.findIndex(x=>x.player.number===n);
 if(idx>=0){
   const p=state.field[idx].player;
   state.field.splice(idx,1);
   if(!state.bench.some(q=>q.number===p.number) && state.bench.length<4) state.bench.push(p);
 }else if(state.field.length<state.formation){
   const p=roster.find(x=>x.number===n);
   const bi=state.bench.findIndex(x=>x.number===n);
   if(bi>=0) state.bench.splice(bi,1);
   state.field.push({player:p,x:50,y:50});
 }
 render(); openRoster();
}

function openBench(){
 openModal(`<h2>Ersatzbank auswählen</h2>
 <p class="help">Tippe auf einen Spieler, um ihn auf die Bank zu setzen. Die vier Bankplätze werden oben angezeigt.</p>
 ${roster.map(p=>{
   const on=state.bench.some(x=>x.number===p.number);
   const field=state.field.some(x=>x.player.number===p.number);
   return `<div class="row"><span><b>${p.number}</b> ${p.firstName} ${p.lastName}</span>
   <button class="${on?'danger':'secondary'}" ${field?'disabled':''} onclick="toggleBench(${p.number})">${on?'Von Bank':'Auf Bank'}</button></div>`;
 }).join("")}<br><button onclick="closeModal()">Fertig</button>`);
}

function toggleBench(n){
 const idx=state.bench.findIndex(p=>p.number===n);
 if(idx>=0) state.bench.splice(idx,1);
 else if(state.bench.length<4 && !state.field.some(x=>x.player.number===n)){
   state.bench.push(roster.find(p=>p.number===n));
 }
 render(); openBench();
}

function openDetails(){
 openModal(`<h2>Spiel</h2>
 <label>Gegner</label><input id="opp" value="${state.opponent}" placeholder="z. B. TSV Musterstadt">
 <label>Datum</label><input id="date" type="date" value="${state.date}">
 <button onclick="saveDetails()">Übernehmen</button>
 <button class="secondary" onclick="closeModal()">Abbrechen</button>`);
}
function saveDetails(){
 state.opponent=document.getElementById("opp").value;
 state.date=document.getElementById("date").value;
 closeModal(); render();
}

function openSave(){
 openModal(`<h2>Aufstellung speichern</h2>
 <input id="saveName" value="${state.name}" placeholder="Name der Aufstellung">
 <button onclick="saveLineup()">Speichern</button>
 <button class="secondary" onclick="closeModal()">Abbrechen</button>`);
}
function saveLineup(){
 state.name=document.getElementById("saveName").value||"Aufstellung";
 state.saved.unshift(JSON.parse(JSON.stringify({
   name:state.name,opponent:state.opponent,date:state.date,formation:state.formation,
   field:state.field,bench:state.bench
 })));
 localStorage.setItem("u11_saved",JSON.stringify(state.saved));
 closeModal(); render();
}

function openSaved(){
 openModal(`<h2>Gespeicherte Aufstellungen</h2>
 ${state.saved.length?state.saved.map((s,i)=>`<div class="row">
 <span><b>${s.name}</b><br><small>${s.formation}er${s.opponent?" · "+s.opponent:""} · ${s.date}</small></span>
 <button onclick="loadSaved(${i})">Laden</button><button class="danger" onclick="deleteSaved(${i})">×</button></div>`).join(""):"<p>Noch nichts gespeichert.</p>"}
 <br><button onclick="closeModal()">Fertig</button>`);
}
function loadSaved(i){
 const s=state.saved[i];
 Object.assign(state,{name:s.name,opponent:s.opponent,date:s.date,formation:s.formation,field:s.field,bench:s.bench||[]});
 closeModal(); render();
}
function deleteSaved(i){
 state.saved.splice(i,1);
 localStorage.setItem("u11_saved",JSON.stringify(state.saved));
 openSaved();
}

async function shareImage(){
 const c=document.createElement("canvas"),w=900,h=1200;
 c.width=w;c.height=h;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
 ctx.fillStyle="#111";ctx.textAlign="center";ctx.font="bold 34px sans-serif";
 ctx.fillText(state.name,w/2,55);
 ctx.font="22px sans-serif";
 ctx.fillText((state.opponent?"gegen "+state.opponent+" · ":"")+state.date+" · "+state.formation+"er",w/2,92);
 ctx.fillStyle="#217b3e";ctx.fillRect(40,130,w-80,h-170);
 ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.strokeRect(42,132,w-84,h-174);
 ctx.beginPath();ctx.moveTo(w/2,130);ctx.lineTo(w/2,h-40);ctx.stroke();
 ctx.beginPath();ctx.arc(w/2,(h+90)/2,105,0,Math.PI*2);ctx.stroke();
 for(const fp of state.field){
   const x=40+fp.x/100*(w-80),y=130+fp.y/100*(h-170);
   ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#111";ctx.font="bold 20px sans-serif";ctx.fillText(fp.player.number,x,y+7);
   ctx.fillStyle="#111d";ctx.fillRect(x-43,y+31,86,22);
   ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";ctx.fillText(fp.player.firstName,x,y+47);
 }
 c.toBlob(async blob=>{
   const file=new File([blob],"U11-Aufstellung.png",{type:"image/png"});
   if(navigator.share && navigator.canShare?.({files:[file]})){
     await navigator.share({title:"U11 Aufstellung",files:[file]});
   }else{
     const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="U11-Aufstellung.png";a.click();
   }
 },"image/png");
}
</script>
</body>
</html>
