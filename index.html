<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16713a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>U11 Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f6;color:#111}
header{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small{color:#6b7280}
button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:#16713a;color:#fff;font-weight:600}
button.secondary{background:#e8eaed;color:#111}.danger{background:#b42318}
.controls{display:flex;gap:7px;padding:0 12px 10px;flex-wrap:wrap}.controls>*{flex:1;min-width:95px}
.fieldWrap{padding:0 10px}.field{position:relative;width:100%;aspect-ratio:0.68;background:#217b3e;border-radius:18px;overflow:hidden;touch-action:none}
.field:before,.field:after{content:"";position:absolute;border:2px solid rgba(255,255,255,.9)}
.field:before{inset:1px}.field:after{left:20%;right:20%;top:16%;bottom:16%;border-radius:0}
.line{position:absolute;background:#fff;opacity:.9}.mid{left:0;right:0;top:50%;height:2px}.circle{position:absolute;width:27%;aspect-ratio:1;border:2px solid #fff;border-radius:50%;left:36.5%;top:36.5%}
.player{position:absolute;transform:translate(-50%,-50%);text-align:center;touch-action:none;z-index:3}.ball{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 2px 7px #0005}.name{margin-top:2px;color:#fff;background:#111c;padding:2px 6px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}
.panel{background:#fff;border-radius:16px;margin:10px;padding:12px}.panel h2{font-size:16px;margin:0 0 8px}.chips{display:flex;gap:6px;overflow:auto}.chip{white-space:nowrap;background:#eef0f2;border-radius:20px;padding:6px 9px;font-size:12px}
footer{display:flex;gap:7px;padding:4px 10px 12px}footer button{flex:1}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:85vh;border-radius:20px 20px 0 0;padding:16px;overflow:auto}.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.row span{flex:1}.row button{padding:7px 10px}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;margin:5px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){body{max-width:500px;margin:auto}.field{aspect-ratio:.7}}
</style>
</head>
<body>
<header><div><h1>⚽ U11 Coach</h1><small id="subtitle">Neue Aufstellung</small></div><button class="secondary" onclick="openRoster()">Spieler</button></header>
<div class="controls">
<select id="formation" onchange="changeFormation()"><option>7er</option><option>8er</option><option>9er</option></select>
<button class="secondary" onclick="openDetails()">Spiel</button>
<button onclick="openSave()">Speichern</button>
</div>
<div class="fieldWrap"><div class="field" id="field"><div class="line mid"></div><div class="circle"></div></div></div>
<div class="panel"><h2>Bank</h2><div class="chips" id="bench"></div></div>
<footer><button onclick="openSaved()" class="secondary">Meine Aufstellungen</button><button onclick="shareImage()">Bild teilen</button></footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const roster=[
[1,"Matteo","Sorin"],[2,"Marco","Heinz"],[3,"Lucas","Lindner"],[4,"Julian","Biber"],[5,"Quirin","Mayinger"],[6,"Leonhard","Reber"],[7,"Milan","Eichinger"],[8,"Vitus","Schneider"],[9,"Jonas","Mayinger"],[10,"Dominic","Pruis"],[11,"Rouslan","Zosimidis"],[12,"Korbinian","Klinger"],[13,"Jonas","Schneider"],[14,"Tobias","Silbermann"],[15,"Kajetan","Radzimowski"],[16,"Zoey","Riss"],[17,"Laura","Schneider"],[18,"Milan","Ninkovic"],[19,"Marcel","Suszko"],[20,"Jonah","Leitmayr"],[21,"Noel","Geuder"],[22,"David","Burzler"],[23,"Oleh","Musienko"],[24,"Leni","Haarnagell"],[25,"Julian","Maile"],[26,"Maciek","Kala"],[27,"Benjamin","Pechtl"]
].map(x=>({number:x[0],firstName:x[1],lastName:x[2]}));
let state={formation:7,name:"Neue Aufstellung",opponent:"",date:new Date().toISOString().slice(0,10),field:[],saved:JSON.parse(localStorage.getItem("u11_saved")||"[]")};
const positions=[[50,10],[24,32],[50,30],[76,32],[20,58],[50,52],[80,58],[35,76],[65,76]];
function defaultField(n){return roster.slice(0,n).map((p,i)=>({player:p,x:positions[i][0],y:positions[i][1]}))}
state.field=defaultField(7); render();

function render(){
 document.getElementById("formation").value=state.formation+"er";
 document.getElementById("subtitle").textContent=state.opponent?`gegen ${state.opponent}`:state.name;
 const f=document.getElementById("field"); f.querySelectorAll(".player").forEach(x=>x.remove());
 state.field.forEach((fp,i)=>{const el=document.createElement("div");el.className="player";el.style.left=fp.x+"%";el.style.top=fp.y+"%";el.innerHTML=`<div class="ball">${fp.player.number}</div><div class="name">${fp.player.firstName}</div>`; addDrag(el,fp); f.appendChild(el)});
 const ids=new Set(state.field.map(x=>x.player.number)); document.getElementById("bench").innerHTML=roster.filter(p=>!ids.has(p.number)).map(p=>`<span class="chip">${p.number} ${p.firstName}</span>`).join("");
}
function addDrag(el,fp){
 let active=false;
 el.addEventListener("pointerdown",e=>{active=true;el.setPointerCapture(e.pointerId);e.preventDefault()});
 el.addEventListener("pointermove",e=>{if(!active)return;const r=document.getElementById("field").getBoundingClientRect();fp.x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));fp.y=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100));el.style.left=fp.x+"%";el.style.top=fp.y+"%"});
 el.addEventListener("pointerup",()=>{active=false});
 el.addEventListener("contextmenu",e=>{e.preventDefault();state.field=state.field.filter(x=>x.player.number!==fp.player.number);render()});
}
function changeFormation(){state.formation=parseInt(document.getElementById("formation").value);let players=state.field.map(x=>x.player);while(players.length<state.formation){const p=roster.find(p=>!players.some(q=>q.number===p.number));if(!p)break;players.push(p)}state.field=defaultField(state.formation);render()}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open")}
function openRoster(){openModal(`<h2>Spieler – ${state.field.length}/${state.formation} auf dem Feld</h2>${roster.map(p=>{let on=state.field.some(x=>x.player.number===p.number);return `<div class="row"><span><b>${p.number}</b> ${p.firstName} ${p.lastName}</span><button class="${on?'danger':'secondary'}" onclick="togglePlayer(${p.number})">${on?'Vom Feld':'Aufs Feld'}</button></div>`}).join("")}<br><button onclick="closeModal()">Fertig</button>`)}
function togglePlayer(n){const idx=state.field.findIndex(x=>x.player.number===n);if(idx>=0)state.field.splice(idx,1);else if(state.field.length<state.formation){const p=roster.find(x=>x.number===n);state.field.push({player:p,x:50,y:50})}render();openRoster()}
function openDetails(){openModal(`<h2>Spiel</h2><label>Gegner</label><input id="opp" value="${state.opponent}" placeholder="z. B. TSV Musterstadt"><label>Datum</label><input id="date" type="date" value="${state.date}"><button onclick="saveDetails()">Übernehmen</button> <button class="secondary" onclick="closeModal()">Abbrechen</button>`)}
function saveDetails(){state.opponent=document.getElementById("opp").value;state.date=document.getElementById("date").value;closeModal();render()}
function openSave(){openModal(`<h2>Aufstellung speichern</h2><input id="saveName" value="${state.name}" placeholder="Name"><button onclick="saveLineup()">Speichern</button> <button class="secondary" onclick="closeModal()">Abbrechen</button>`)}
function saveLineup(){state.name=document.getElementById("saveName").value||"Aufstellung";state.saved.unshift(JSON.parse(JSON.stringify({name:state.name,opponent:state.opponent,date:state.date,formation:state.formation,field:state.field})));localStorage.setItem("u11_saved",JSON.stringify(state.saved));closeModal();render()}
function openSaved(){openModal(`<h2>Gespeicherte Aufstellungen</h2>${state.saved.length?state.saved.map((s,i)=>`<div class="row"><span><b>${s.name}</b><br><small>${s.formation}er${s.opponent?" · "+s.opponent:""} · ${s.date}</small></span><button onclick="loadSaved(${i})">Laden</button><button class="danger" onclick="deleteSaved(${i})">×</button></div>`).join(""):"<p>Noch nichts gespeichert.</p>"}<br><button onclick="closeModal()">Fertig</button>`)}
function loadSaved(i){const s=state.saved[i];Object.assign(state,{name:s.name,opponent:s.opponent,date:s.date,formation:s.formation,field:s.field});closeModal();render()}
function deleteSaved(i){state.saved.splice(i,1);localStorage.setItem("u11_saved",JSON.stringify(state.saved));openSaved()}
async function shareImage(){
 const c=document.createElement("canvas"),w=900,h=1200;c.width=w;c.height=h;const ctx=c.getContext("2d");
 ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.fillStyle="#111";ctx.textAlign="center";ctx.font="bold 34px sans-serif";ctx.fillText(state.name,w/2,55);ctx.font="22px sans-serif";ctx.fillText((state.opponent?"gegen "+state.opponent+" · ":"")+state.date+" · "+state.formation+"er",w/2,92);
 ctx.fillStyle="#217b3e";ctx.fillRect(40,130,w-80,h-170);ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.strokeRect(42,132,w-84,h-174);ctx.beginPath();ctx.moveTo(w/2,130);ctx.lineTo(w/2,h-40);ctx.stroke();ctx.beginPath();ctx.arc(w/2,(h+90)/2,105,0,Math.PI*2);ctx.stroke();
 for(const fp of state.field){const x=40+fp.x/100*(w-80),y=130+fp.y/100*(h-170);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.font="bold 22px sans-serif";ctx.fillText(fp.player.number,x,y+8);ctx.fillStyle="#111c";ctx.fillRect(x-45,y+34,90,23);ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.fillText(fp.player.firstName,x,y+51)}
 c.toBlob(async blob=>{const file=new File([blob],"U11-Aufstellung.png",{type:"image/png"});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:"U11 Aufstellung",files:[file]})}else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="U11-Aufstellung.png";a.click()}}, "image/png")}
</script>
</body></html>
